server {
    listen 8080;
    server_name _;
    access_log off;
    client_max_body_size 8k;

    # Resolve via Docker DNS so a BEpusdt restart can change its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bepusdt http://bepusdt:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = /healthz { return 200 "ok\n"; }
    location ~ "^/pay/checkout/[A-Za-z0-9]{18}$" { proxy_pass $bepusdt; }
    location ~ ^/checkout/[a-zA-Z0-9_-]+/assets/ { proxy_pass $bepusdt; }
    location /payment/assets/ { proxy_pass $bepusdt; }
    location = /api/v1/pay/info { proxy_pass $bepusdt; }
    location / { return 404; }
}
