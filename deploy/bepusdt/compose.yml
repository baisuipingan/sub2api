services:
  bepusdt:
    image: v03413/bepusdt@sha256:53c17c0cc9fddc87dab86f9e8438093f6bb91e603eb6efe9b9e5eb363f04ea6b
    restart: unless-stopped
    command: ["start"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/var/lib/bepusdt
    ports:
      - "127.0.0.1:18091:8080"
    networks:
      checkout:
      sub2api:
        aliases: [milo-bepusdt]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/payment/assets/img/icon-4.png"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  checkout:
    image: nginx@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: unless-stopped
    depends_on:
      bepusdt:
        condition: service_healthy
    volumes:
      - ./checkout.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18090:8080"
    networks: [checkout]

networks:
  checkout:
  sub2api:
    external: true
    name: ${SUB2API_DOCKER_NETWORK:?Set SUB2API_DOCKER_NETWORK}
