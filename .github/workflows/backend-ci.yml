name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    # These portable shell checks need macOS, not a particular CPU architecture.
    # Explicit Intel avoids the capacity-constrained hosted ARM runner queue.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  office-agent-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned Agent environment
        run: |
          python -m pip install uv==0.12.15
          uv sync --project services/office-agent --frozen --python 3.12
      - name: Agent and isolated-executor contract tests
        run: |
          uv run --project services/office-agent --frozen pytest -q services/office-agent/tests
          PYTHONPATH=services/office-executor PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s services/office-executor/tests -v
      - name: Go pilot concurrency and existing desktop regression
        working-directory: backend
        run: go test -race ./internal/config ./internal/service ./internal/handler ./internal/server/routes -run 'TestOffice|TestDesktopAgent' -count=1 -p=1
      - name: Real Python graph through Go model bridge
        working-directory: backend
        env:
          OFFICE_AGENT_TEST_PYTHON: ${{ github.workspace }}/services/office-agent/.venv/bin/python
        run: go test -tags integration ./internal/service ./internal/handler -run '^TestOfficePython' -count=1 -p=1 -v
      - name: Embedded API routing regression
        working-directory: backend
        run: |
          mkdir -p internal/web/dist/assets
          printf '%s' '<!doctype html><html><head><title>Sub2API</title></head><body>CI embed fixture</body></html>' > internal/web/dist/index.html
          printf '%s' '<svg xmlns="http://www.w3.org/2000/svg"></svg>' > internal/web/dist/logo.svg
          printf '%s' 'export const embeddedFixture = true' > internal/web/dist/assets/index-AbCd1234.js
          go test -tags embed ./internal/web -run 'TestFrontendServer_Middleware|TestServeEmbeddedFrontend' -count=1
      # Real gVisor/Office rendering has a separate Linux acceptance probe. CI
      # must not claim this by substituting runc or running generated code here.

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
